name: fork-sync-upstream

# The ONLY automation in this fork. All other files under
# .github/workflows/ were removed on purpose: upstream CI needs
# runners/secrets this fork does not have, and every push spammed
# failure notifications.
#
# What this does, daily + on demand:
#   1. merge upstream/master into the current default branch (resolved
#      dynamically, so renaming the default branch needs no edits here)
#   2. compile-check the result (Metal + kvmem)
#   3. push, but only if the build passes
#   4. publish the binaries to a single rolling release (old release
#      and any stray releases are deleted first, so there is exactly one)
# Any failure fails the job, which is the notification. Nothing is
# ever pushed or published half-done.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26-intel
    timeout-minutes: 240
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master into default branch
        run: |
          set -e
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream master --prune
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "upstream is $BEHIND commits ahead of $BRANCH"
          if [ "$BEHIND" = "0" ]; then
            echo "UP_TO_DATE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git merge --no-edit -m "fork-sync: merge upstream master into $BRANCH" upstream/master || {
            git merge --abort
            echo "MERGE CONFLICT, resolve manually"
            exit 1
          }

      - name: Compile (Metal + kvmem)
        if: env.UP_TO_DATE != '1'
        run: |
          set -e
          cmake -S . -B build-fork-sync -DGGML_METAL=ON -DLLAMA_KVMEM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fork-sync --target llama-kvmem-cli llama-kvmem-server -j "$(sysctl -n hw.ncpu)"

      - name: Push
        if: env.UP_TO_DATE != '1'
        run: |
          set -e
          git push origin "${{ github.event.repository.default_branch }}"

      - name: Publish single rolling release
        if: env.UP_TO_DATE != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          UPSTREAM_SHA=$(git rev-parse --short upstream/master)
          DATE=$(date +%Y%m%d)
          mkdir -p release-pkg
          cp build-fork-sync/bin/llama-kvmem-cli build-fork-sync/bin/llama-kvmem-server release-pkg/
          tar -czf kvmem-metal-macos.tar.gz -C release-pkg .
          export SHA UPSTREAM_SHA DATE
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          sha = os.environ["SHA"]
          upstream_sha = os.environ["UPSTREAM_SHA"]
          date = os.environ["DATE"]
          base = "https://api.github.com/repos/" + repo

          def api(method, path, data=None, raw=None, ctype="application/json"):
              req = urllib.request.Request(base + path, method=method,
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": "Bearer " + token,
                           "X-GitHub-Api-Version": "2022-11-28"})
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  req.add_header("Content-Type", ctype)
              elif raw is not None:
                  body = raw
                  req.add_header("Content-Type", ctype)
              try:
                  with urllib.request.urlopen(req, body) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return e.code, None

          # delete every existing release so exactly one remains
          _, rels = api("GET", "/releases?per_page=100")
          for r in rels or []:
              api("DELETE", "/releases/%d" % r["id"])
              api("DELETE", "/git/refs/tags/%s" % r["tag_name"])

          # create the rolling release
          _, rel = api("POST", "/releases", {
              "tag_name": "rolling",
              "target_commitish": branch,
              "name": "Rolling %s (%s)" % (date, sha),
              "body": "Auto build of `%s` @ `%s` (upstream `%s`)." % (branch, sha, upstream_sha),
          })
          rid = rel["id"]

          # upload the binary tarball
          up = urllib.request.Request(
              "https://uploads.github.com/repos/%s/releases/%d/assets?name=kvmem-metal-macos.tar.gz"
              % (repo, rid), method="POST",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": "Bearer " + token,
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/gzip"},
              data=open("kvmem-metal-macos.tar.gz", "rb").read())
          with urllib.request.urlopen(up) as r:
              assert r.status == 201, r.status
          print("rolling release published")
          EOF
