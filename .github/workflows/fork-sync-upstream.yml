name: fork-sync-upstream

# The ONLY automation in this fork. All other files under
# .github/workflows/ were removed on purpose: upstream CI needs
# runners/secrets this fork does not have, and every push spammed
# failure notifications (e.g. build-cann.yml has zero active jobs
# but still triggers on push).
#
# What this does, daily + on demand:
#   1. merge upstream/master into the current default branch (resolved
#      dynamically, so renaming the default branch needs no edits here)
#   2. compile-check the result (Metal + kvmem)
#   3. push only if the build passes
# Any failure (conflict or red build) fails the job, which is the
# notification. Nothing is ever pushed half-done.

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream master into default branch
        run: |
          set -e
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true
          git fetch upstream master --prune
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "upstream is $BEHIND commits ahead of $BRANCH"
          if [ "$BEHIND" = "0" ]; then
            echo "UP_TO_DATE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git merge --no-edit -m "fork-sync: merge upstream master into $BRANCH" upstream/master || {
            git merge --abort
            echo "MERGE CONFLICT, resolve manually"
            exit 1
          }

      - name: Compile check (Metal + kvmem)
        if: env.UP_TO_DATE != '1'
        run: |
          set -e
          cmake -S . -B build-fork-sync -DGGML_METAL=ON -DLLAMA_KVMEM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fork-sync --target llama-kvmem-cli -j "$(sysctl -n hw.ncpu)"

      - name: Push
        if: env.UP_TO_DATE != '1'
        run: |
          set -e
          git push origin "${{ github.event.repository.default_branch }}"
